services:
  moonraker-obico:
    image: ghcr.io/thespaghettidetective/moonraker-obico:latest
    # Uncomment to build from this repo instead of pulling the published image:
    # build: .
    container_name: moonraker-obico
    restart: unless-stopped
    privileged: true
    volumes:
      - ./config:/opt/printer_data/config
      - ./logs:/opt/printer_data/logs
